                    <div className="bg-white rounded-2xl p-6 custom-shadow border border-[#e4e3db] mb-6">
                      <h2 className="font-serif text-lg font-bold text-[#570013] mb-4 flex items-center">
                        <span className="material-symbols-outlined text-[#D4AF37] mr-2">edit_note</span>
                        Make It Yours
                      </h2>
                      <div className="space-y-4 text-left">
                        <div>
                          <label className="block text-xs uppercase font-semibold text-[#584141] mb-1">Mug 1 Name</label>
                          <input
                            type="text"
                            value={mug1}
                            onChange={(e) => setMug1(e.target.value)}
                            className="w-full bg-[#FFFDF5] border border-[#e0bfbf] rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#D4AF37]"
                          />
                        </div>
                        <div>
                          <label className="block text-xs uppercase font-semibold text-[#584141] mb-1">Mug 2 Name</label>
                          <input
                            type="text"
                            value={mug2}
                            onChange={(e) => setMug2(e.target.value)}
                            className="w-full bg-[#FFFDF5] border border-[#e0bfbf] rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#D4AF37]"
                          />
                        </div>
                        <div>
                          <label className="block text-xs uppercase font-semibold text-[#584141] mb-1">Est. Date</label>
                          <input
                            type="date"
                            value={date}
                            onChange={(e) => setDate(e.target.value)}
                            className="w-full bg-[#FFFDF5] border border-[#e0bfbf] rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-[#D4AF37]"
                          />
                        </div>
                      </div>

                      {/* Live Preview Display */}
                      <div className="mt-5 p-4 bg-[#FFFDF5] rounded-xl border border-[#D4AF37]/50">
                        <span className="text-[10px] font-bold uppercase tracking-wider text-[#735c00] block mb-2">
                          Live Engraving Preview
                        </span>
                        <div className="grid grid-cols-2 gap-2 text-center">
                          <div className="bg-white p-3 rounded-lg border border-[#FDF2F2] shadow-xs">
                            <span className="text-[9px] text-[#735c00] uppercase block">Mug 1</span>
                            <p className="font-serif italic font-bold text-[#570013] text-base">{mug1 || 'Hers'}</p>
                          </div>
                          <div className="bg-white p-3 rounded-lg border border-[#FDF2F2] shadow-xs">
                            <span className="text-[9px] text-[#735c00] uppercase block">Mug 2</span>
                            <p className="font-serif italic font-bold text-[#570013] text-base">{mug2 || 'His'}</p>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Actions */}
                    <div className="flex gap-4 mb-8">
                      <button
                        onClick={() => handleAddToCart('Morning Love Mugs')}
                        className={`flex-1 py-4 rounded-full font-bold uppercase text-xs tracking-widest transition-all shadow-md ${
                          addedAnim ? 'bg-[#735c00] text-white' : 'bg-[#570013] text-white hover:bg-[#800020] btn-hover-glow'
                        }`}
                      >
                        {addedAnim ? 'Added to Gift Box! ♥' : 'Add to My Gift Box'}
                      </button>
                      <button
                        onClick={() => toggleWish('morning-love-mugs')}
                        className={`w-14 h-14 rounded-full border-2 flex items-center justify-center ${
                          wishlist.includes('morning-love-mugs') ? 'bg-[#570013] border-[#570013] text-white' : 'border-[#e0bfbf] text-[#570013]'
                        }`}
                      >
                        <span className="material-symbols-outlined" style={{ fontVariationSettings: wishlist.includes('morning-love-mugs') ? "'FILL' 1" : "'FILL' 0" }}>
                          favorite
                        </span>
                      </button>
                    </div>

                    {/* Details Accordion */}
                    <div className="border-t border-[#e0bfbf] divide-y divide-[#e0bfbf] text-left">
                      <details className="py-3" open>
                        <summary className="font-serif font-bold text-sm cursor-pointer text-[#1b1c17]">Description</summary>
                        <p className="text-xs text-[#584141] mt-2 leading-relaxed">
                          Start your mornings with intention and romance. Hand-glazed ceramic mugs with custom gold leaf personalizations.
                        </p>
                      </details>
                      <details className="py-3">
                        <summary className="font-serif font-bold text-sm cursor-pointer text-[#1b1c17]">Material &amp; Care</summary>
                        <p className="text-xs text-[#584141] mt-2 leading-relaxed">
                          High-fired ceramic, 11 oz capacity. Hand washing recommended for preserving gold lettering.
                        </p>
                      </details>
                      <details className="py-3">
                        <summary className="font-serif font-bold text-sm cursor-pointer text-[#1b1c17]">Shipping Info</summary>
                        <p className="text-xs text-[#584141] mt-2 leading-relaxed">
                          Complimentary luxury gift box packaging. 3-5 business days custom production.
                        </p>
                      </details>
                    </div>
                  </div>
                </div>

                {/* Complete the Gift */}
                <div className="mt-16 pt-8 border-t border-[#e0bfbf] text-center">
                  <h3 className="font-serif text-2xl font-bold text-[#570013] mb-6">Complete the Gift</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                    {crossSellItems.map((item) => (
                      <div key={item.id} className="bg-white rounded-2xl p-4 border border-[#FDF2F2] premium-shadow">
                        <img src={item.img} className="w-full aspect-square object-cover rounded-xl mb-3" />
                        <h4 className="font-serif font-bold text-sm text-[#1b1c17]">{item.title}</h4>
                        <p className="text-[#570013] font-bold text-xs mb-3">{item.price}</p>
                        <button
                          onClick={() => handleAddToCart(item.title)}
                          className="w-full py-2 rounded-full border border-[#570013] text-[#570013] text-[11px] font-bold uppercase hover:bg-[#570013] hover:text-white transition-all"
                        >
                          + Add to Gift Box
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="py-12 border-t border-[#e0bfbf] bg-[#f0eee6]/60 text-center">
            <h2 className="font-serif text-2xl font-bold text-[#570013] italic mb-1">Amore &amp; Co.</h2>
            <p className="text-xs uppercase tracking-widest text-[#735c00] mb-4">Sophisticated Romance</p>
            <p className="text-xs text-[#584141]">© {new Date().getFullYear()} Amore &amp; Co. All rights reserved.</p>
          </footer>

          {/* Toast */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-[#570013] text-white px-5 py-3 rounded-full shadow-2xl border border-[#D4AF37] text-xs font-semibold flex items-center gap-2">
              <span className="text-[#D4AF37]">♥</span>
              <span>{toast}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
